<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account - Nextel Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    
    <style>
        :root {
            --dark:        #071a0f;
            --dark-card:   #0b2516;
            --green-light: #25a060;
            --gold:        #C9A84C;
            --gold-light:  #D4A843;
            --text-muted:  rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 0;
        }

        .payment-container {
            max-width: 480px;
            width: 100%;
            margin: auto;
            padding: 15px;
        }

        .payment-card {
            background: linear-gradient(145deg, #0a2215, #06170e);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .brand-header h2 span {
            color: var(--green-light);
        }

        .timer-strip {
            background: rgba(239, 68, 68, 0.1);
            border: 1px dashed rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            color: #f87171;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .timer-counter {
            font-family: monospace;
            font-size: 1rem;
            font-weight: 800;
            background: rgba(239, 68, 68, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 4px;
            letter-spacing: 0.5px;
        }

        .bank-info-sheet {
            background: #ffffff;
            color: #111827;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 24px;
        }
        
        .sheet-greeting {
            color: #1e3a8a;
            font-weight: 800;
            font-size: 1.25rem;
        }
        
        .sheet-subtitle {
            font-size: 0.8rem;
            color: #4b5563;
            line-height: 1.4;
            margin-bottom: 0;
        }
        .sheet-subtitle strong {
            color: #4338ca;
        }

        .amount-display {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .amount-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .amount-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gold);
            margin: 4px 0;
        }

        .btn-submit-squad {
            background: linear-gradient(135deg, #25a060, #1b7a49);
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-submit-squad:hover { color: #fff; }
        .btn-submit-squad:active { transform: scale(0.99); }

        .btn-submit-telegram {
            background: linear-gradient(135deg, #24A1DE, #1d82b2);
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            display: links;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .btn-submit-telegram:hover { color: #fff; }
        .btn-submit-telegram:active { transform: scale(0.99); }

        .btn-back {
            display: block;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="payment-container">
    <div class="payment-card">
        
        <div class="brand-header">
            <h2>NEXTEL <span>Connect</span></h2>
            <span class="badge bg-warning text-dark font-monospace" style="font-size: 0.7rem; font-weight: 700;">WORKSPACE ACTIVATION</span>
        </div>

        <div class="timer-strip">
            <i class="fas fa-clock"></i> Secure session expires in: <span class="timer-counter" id="paymentTimer">10:00</span>
        </div>

        <div class="bank-info-sheet">
            <div class="sheet-greeting" id="personalGreeting">Hello Team! 👋</div>
            <div class="sheet-subtitle" id="instructionSubtitle">Complete your online payment securely via Squadco below.</div>
        </div>

        <div class="amount-display">
            <div class="amount-label">Required Package Fee</div>
            <div class="amount-val" id="amountText">₦17,500.00</div>
        </div>
        
        <!-- Dynamic Squadco Payment Button -->
        <a href="#" id="squadPayBtn" target="_blank" class="btn-submit-squad">
            <i class="fas fa-credit-card"></i> Pay Online with Squadco
        </a>

        <!-- Telegram Verification Button -->
        <button type="button" id="telegramBtn" class="btn-submit-telegram">
            <i class="fab fa-telegram-plane"></i> I've Paid - Submit on Telegram
        </button>

        <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left me-1"></i> Cancel & Go Back</a>
    </div>
</div>

<script>
    let rawAmount = "17500"; 
    let selectedSquadLink = "https://pay.squadco.com/HJ1E1G"; // Default Standard Plan Link
    let userEmail = "";
    let userPhone = "";
    let userName = "Team";

    try {
        const rawData = sessionStorage.getItem("nxt_user");
        if (rawData) {
            const localUserData = JSON.parse(rawData);
            
            if (localUserData.planName === "Nextel Lite") {
                rawAmount = "10500";
                selectedSquadLink = "https://pay.squadco.com/1HDGUM"; // Nextel Lite Link
                document.getElementById("amountText").textContent = "₦10,500.00";
            }
            
            if (localUserData.username) {
                userName = localUserData.username;
            }
            
            userEmail = localUserData.email || "";
            userPhone = localUserData.phone || "";
        }
    } catch(e) {
        console.error("Failed parsing storage context session indicators", e);
    }

    document.getElementById("personalGreeting").textContent = `Hello, ${userName}! 👋`;
    document.getElementById("instructionSubtitle").innerHTML = `Hello <strong>${userName}</strong>, click the button below to complete your payment securely.`;

    // Set the dynamic href for Squadco checkout
    document.getElementById("squadPayBtn.href") // Wait, fix assignment:
    document.getElementById("squadPayBtn").href = selectedSquadLink;

    const baseText = "Hello Coach 👋\n\nI have successfully made payment via Squadco for NEXTEL registration.\n\nKindly verify my payment.\n\nEmail Address: " + userEmail + "\nPhone Number: " + userPhone;
    const encodedText = encodeURIComponent(baseText);
    
    const telegramAppUrl = `tg://resolve?domain=Nextelsupportt&text=${encodedText}`;
    const telegramWebUrl = `https://t.me/Nextelsupportt?text=${encodedText}`;

    document.getElementById("telegramBtn").addEventListener("click", function() {
        let windowOpened = window.open(telegramAppUrl, '_blank');
        
        setTimeout(() => {
            if (!windowOpened || windowOpened.closed || typeof windowOpened.closed == 'undefined') {
                window.location.href = telegramWebUrl;
            } else {
                window.location.href = telegramWebUrl;
            }
        }, 500);
    });

    let durationSeconds = 10 * 60;
    const timerDisplay = document.getElementById("paymentTimer");
    
    const countdownInterval = setInterval(() => {
        let minutes = Math.floor(durationSeconds / 60);
        let seconds = durationSeconds % 60;

        let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
        let displaySeconds = seconds < 10 ? "0" + seconds : seconds;

        timerDisplay.textContent = `${displayMinutes}:${displaySeconds}`;

        if (durationSeconds <= 0) {
            clearInterval(countdownInterval);
            timerDisplay.textContent = "EXPIRED";
            timerDisplay.style.background = "#ef4444";
        } else {
            durationSeconds--;
        }
    }, 1000);
</script>
</body>
</html>
